<!DOCTYPE html>
<html lang="en" style="height: 100%; margin: 0;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ngefont! Preview</title>
    <meta name="theme-color" content="#121212">
    <link rel="shortcut icon" href="nf-ico.png" type="image/x-icon">
    
    <!-- Tailwind via Browser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <!-- Supabase (UMD browser bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <link rel="stylesheet" href="./src/style.css">
    <style>
        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .font-preview-item {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col h-full w-full bg-[#0F0F0F] text-gray-200 font-sans overflow-x-hidden">

  <!-- Header -->
  <header class="h-16 flex items-center px-4 md:px-8 border-b border-white/10 bg-[#121212] z-40 relative shrink-0">
    <div class="flex items-center gap-3 min-w-0">
      <a href="/" id="dynamic-title" class="text-xl md:text-2xl tracking-tighter hover:text-white transition-colors">Ngefont!</a>
      <span class="text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/20 uppercase tracking-widest ml-2">Preview</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto w-full max-w-5xl mx-auto px-4 py-8 md:py-12">
    
    <!-- Controls Section -->
    <div class="mb-12 space-y-6 bg-[#1a1a1a] p-6 border border-white/5 rounded-xl shadow-2xl">
      <div>
        <label for="preview-text" class="block text-[10px] uppercase tracking-widest text-gray-400 mb-2">Test Your Text</label>
        <textarea id="preview-text" rows="2" class="w-full bg-[#0c0c0c] border border-white/10 text-white text-lg md:text-2xl p-4 outline-none focus:border-white/40 transition-colors rounded-lg resize-none" placeholder="Tuliskan sesuatu untuk mencoba font..."></textarea>
      </div>
      
      <div class="flex flex-wrap items-center gap-4">
        <div class="flex items-center gap-2">
          <label class="text-[10px] uppercase tracking-widest text-gray-400">Size</label>
          <input type="range" id="size-slider" min="24" max="160" value="64" class="w-32 accent-white bg-white/10 h-1 rounded-full appearance-none">
          <span id="size-label" class="text-xs text-white font-mono w-10 text-right">64px</span>
        </div>
        <div class="w-px h-6 bg-white/10 hidden md:block"></div>
        <button id="btn-randomize" class="px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded text-xs uppercase tracking-widest transition-colors flex items-center gap-2 cursor-pointer">
          <span class="material-symbols-outlined text-[16px]">shuffle</span>
          Random Text
        </button>
      </div>
    </div>

    <!-- Font List -->
    <div id="loading-indicator" class="flex flex-col items-center justify-center py-20 text-gray-500">
        <span class="material-symbols-outlined text-[48px] animate-spin mb-4">refresh</span>
        <p class="text-xs uppercase tracking-widest">Loading Fonts...</p>
    </div>
    
    <div id="font-list" class="space-y-16">
      <!-- Font previews will be injected here -->
    </div>

  </main>

  <script src="./src/preview.js"></script>
</body>
</html>
